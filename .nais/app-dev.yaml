apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: proxy
  namespace: oksty
  labels:
    team: oksty
spec:
  image: {{image}}
  port: 8080

  ingresses:
    - https://proxy.intern.dev.nav.no

  azure:
    application:
      enabled: true
      tenant: nav.no

  prometheus:
    enabled: true
    path: /internal/prometheus

  liveness:
    path: /internal/isalive
    initialDelay: 10
    timeout: 1
  readiness:
    path: /internal/isready
    initialDelay: 10
    timeout: 1

  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi

  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 80

  accessPolicy:
    inbound:
      rules: []
    outbound:
      external:
        - host: api.ivalua.com

  env:
    - name: IVALUA_BASE_URL
      value: "https://api.ivalua.com"
